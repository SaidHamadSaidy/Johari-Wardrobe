<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Johari Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE5; --surface:#FFFDF8; --ink:#0A1A2F; --muted:#56606E; --line:#E0D4BC; --navy:#0A1A2F;
  --gold:#C9A44C; --gold-ink:#7A5E1F; --ok:#1F7A4D; --warn:#9A5B00; --bad:#B3261E; --chip:#EFE6D3;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#081322; --surface:#0E1E33; --ink:#F2EBDD; --muted:#A9B3C1; --line:#24364F; --gold-ink:#E3C878; --ok:#7FD6A6; --warn:#F2C14E; --bad:#FFB4AB; --chip:#16294A; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#081322; --surface:#0E1E33; --ink:#F2EBDD; --muted:#A9B3C1; --line:#24364F; --gold-ink:#E3C878; --ok:#7FD6A6; --warn:#F2C14E; --bad:#FFB4AB; --chip:#16294A; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1rem;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:60}
h1,h2,h3{font-family:"Bodoni Moda",Georgia,serif;font-weight:400;margin:0 0 .5em;line-height:1.1}
h2{font-size:1.9rem}
a{color:var(--gold-ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{width:min(1180px,100% - 2rem);margin-inline:auto}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-ink)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy);color:#F2EBDD}
.bar{display:flex;align-items:center;gap:1rem;min-height:64px;flex-wrap:wrap}
.brand{font-family:"Bodoni Moda",Georgia,serif;font-size:1.25rem;letter-spacing:.18em;margin-right:auto}
.brand small{display:block;font-family:"Hanken Grotesk",sans-serif;font-size:.6rem;letter-spacing:.4em;color:#E3C878}
nav.tabs{display:flex;gap:.2rem;overflow-x:auto}
nav.tabs button{min-height:44px;padding:0 .9rem;border:0;border-bottom:2px solid transparent;background:none;color:#C9D0DA;font:inherit;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:#F2EBDD;border-color:#C9A44C}
.sync{font-size:.78rem;color:#C9D0DA}
.sync b{color:#E3C878;font-weight:600}

main{padding:1.6rem 0 4rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.5rem 1.1rem;border:1px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:none;border-radius:2px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0A1A2F}
.btn.gold:hover{filter:brightness(1.08);background:var(--gold);color:#0A1A2F}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;margin-bottom:1.2rem}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin-bottom:1.8rem}
.stat{background:var(--surface);border:1px solid var(--line);padding:1.1rem 1.2rem}
.stat b{display:block;font-family:"Bodoni Moda",Georgia,serif;font-weight:400;font-size:1.9rem;line-height:1.1;margin:.3rem 0 .1rem}
.panel{background:var(--surface);border:1px solid var(--line);padding:1.2rem 1.3rem;margin-bottom:1.4rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem}
@media (max-width:860px){.two{grid-template-columns:1fr}}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.7rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap}
.tscroll{overflow-x:auto}
.thumb{width:48px;height:58px;display:grid;place-items:center;overflow:hidden;border-radius:2px}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb span{font-size:.6rem;font-weight:700;letter-spacing:.1em;color:#E3C878}

.pill{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--chip);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chips button{min-height:38px;padding:0 .8rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:.82rem;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

label{display:grid;gap:.3rem;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
label .hint{font-size:.8rem;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
input,select,textarea{font:inherit;font-size:1rem;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:.6rem .7rem;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
input[type="color"]{padding:2px;height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.form{display:grid;gap:1rem}

dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;width:min(760px,calc(100% - 1.5rem));max-height:calc(100% - 1.5rem);overflow:auto;border-radius:2px}
dialog::backdrop{background:rgba(5,12,22,.65)}
.dhead{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.3rem;background:var(--navy);color:#F2EBDD}
.dhead h3{margin:0;font-size:1.4rem}
.dhead button{width:44px;height:44px;border:1px solid rgba(227,200,120,.6);background:none;color:#F2EBDD;font-size:1.2rem;cursor:pointer}
.dbody{padding:1.3rem}
.dfoot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;padding:1rem 1.3rem;background:var(--surface);border-top:1px solid var(--line)}
.preview{width:120px;height:150px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:var(--bg)}
.preview img{width:100%;height:100%;object-fit:cover}
.items td{padding:.45rem .4rem}
.items input{min-height:38px;padding:.35rem .5rem}

.setup{max-width:640px;margin:3rem auto}
.steps{padding-left:1.2rem}
.steps li{margin-bottom:.5rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,200%);background:var(--navy);color:#F2EBDD;border:1px solid var(--gold);padding:.85rem 1.3rem;max-width:calc(100% - 2rem);transition:transform .4s;z-index:90}
.toast.show{transform:translate(-50%,0)}
.toast.err{border-color:var(--bad)}
.empty{padding:2rem;text-align:center;color:var(--muted)}
@media (max-width:700px){
  .mobile-cards thead{display:none}
  .mobile-cards tr{display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
  .mobile-cards td{border:0;padding:.1rem 0}
  .mobile-cards td.num{text-align:left}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <div class="brand">JOHARI<small>OPERATIONS</small></div>
    <nav class="tabs" role="tablist" aria-label="Sections" id="tabs" hidden>
      <button role="tab" data-tab="dash" aria-selected="true">Dashboard</button>
      <button role="tab" data-tab="orders" aria-selected="false">Orders</button>
      <button role="tab" data-tab="products" aria-selected="false">Products</button>
      <button role="tab" data-tab="customers" aria-selected="false">Customers</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </nav>
    <span class="sync" id="sync"></span>
  </div>
</header>

<main class="wrap" id="main"></main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dhead"><h3 id="dlgTitle"></h3><button id="dlgX" aria-label="Close">×</button></div>
  <div class="dbody" id="dlgBody"></div>
  <div class="dfoot" id="dlgFoot"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   Johari Operations
   Products and settings are published to your PUBLIC store repository
   (products.json, config.json, images/). Orders are kept in a separate
   PRIVATE repository (orders.json), so customer details are never public.
   Your access key stays only in this browser.
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tzs = n => "TSh " + Math.round(+n || 0).toLocaleString("en-US");
const num = v => +String(v ?? "").replace(/[^\d.-]/g, "") || 0;
const STATUSES = ["New","Confirmed","Paid","Sourcing","Out for delivery","Delivered","Cancelled"];
const PAID = ["Paid","Sourcing","Out for delivery","Delivered"];
const ART = { jar:"Spice jar", sticks:"Cinnamon sticks", box:"Gift box", basket:"Basket", bowl:"Bowl", fabric:"Fabric (kanga, kikoi)", shirt:"Shirt", jersey:"Jersey" };
const KEY = "johari-ops";

let S = load(KEY, null);                 // connection settings
let D = { products:[], config:null, orders:[], sha:{} };
let dirty = { products:false, config:false };
let tab = "dash", orderFilter = "All", orderSearch = "";

function load(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
let tt; function toast(msg, err){ const t = $("toast"); t.textContent = msg; t.classList.toggle("err", !!err); t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 3600); }
function syncNote(){ $("sync").innerHTML = S ? (S.mode === "github" ? `Connected to <b>${esc(S.user)}/${esc(S.repo)}</b>` : `<b>This device only</b>`) : ""; }

/* ---------- GitHub storage ---------- */
const enc = s => btoa(unescape(encodeURIComponent(s)));
const dec = b => decodeURIComponent(escape(atob(b.replace(/\n/g, ""))));
const gh = (repo, path) => `https://api.github.com/repos/${encodeURIComponent(S.user)}/${encodeURIComponent(repo)}/contents/${path}`;
const H = () => ({ "Authorization":"Bearer " + S.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" });
async function ghGet(repo, path){
  const r = await fetch(gh(repo, path) + "?ref=" + encodeURIComponent(S.branch || "main") + "&t=" + Date.now(), { headers:H(), cache:"no-store" });
  if (r.status === 404) return { text:null, sha:null };
  if (!r.ok) throw new Error(await errText(r));
  const j = await r.json();
  return { text:dec(j.content), sha:j.sha };
}
async function ghPut(repo, path, b64, sha, message){
  const body = { message, content:b64, branch:S.branch || "main" };
  if (sha) body.sha = sha;
  const r = await fetch(gh(repo, path), { method:"PUT", headers:{ ...H(), "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (!r.ok) throw new Error(await errText(r));
  return (await r.json()).content.sha;
}
async function errText(r){
  let m = ""; try { m = (await r.json()).message || ""; } catch(e){}
  if (r.status === 401) return "Your access key was refused. Check it in Settings.";
  if (r.status === 403) return "GitHub refused the change (" + m + "). Check the key has Contents: Read and write on both repositories.";
  if (r.status === 404) return "Repository not found. Check the names in Settings.";
  if (r.status === 409) return "Someone saved a newer version. Reload and try again.";
  return "GitHub error " + r.status + (m ? ": " + m : "");
}

/* ---------- load everything ---------- */
async function loadAll(){
  $("main").innerHTML = `<p class="empty">Loading…</p>`;
  try {
    if (S.mode === "github"){
      const [p, c, o] = await Promise.all([ghGet(S.repo, "products.json"), ghGet(S.repo, "config.json"), ghGet(S.dataRepo, "orders.json")]);
      D.products = p.text ? JSON.parse(p.text) : []; D.sha.products = p.sha;
      D.config = c.text ? JSON.parse(c.text) : defaultConfig(); D.sha.config = c.sha;
      D.orders = o.text ? JSON.parse(o.text) : []; D.sha.orders = o.sha;
    } else {
      const local = load(KEY + "-data", null);
      if (local){ D.products = local.products; D.config = local.config; D.orders = local.orders; }
      else {
        try { const [p, c] = await Promise.all([fetch("products.json"), fetch("config.json")]); D.products = p.ok ? await p.json() : []; D.config = c.ok ? await c.json() : defaultConfig(); }
        catch(e){ D.products = []; D.config = defaultConfig(); }
        D.orders = [];
      }
    }
    $("tabs").hidden = false; syncNote(); render();
  } catch(e){
    $("main").innerHTML = `<div class="panel setup"><h2>Couldn’t connect</h2><p>${esc(e.message)}</p><div class="row"><button class="btn gold" id="retry">Try again</button><button class="btn" id="reset">Change connection</button></div></div>`;
    $("retry").onclick = loadAll; $("reset").onclick = () => { S = null; save(KEY, null); setup(); };
  }
}
function defaultConfig(){ return { name:"Johari Market", whatsapp:"255700000000", lipaNamba:"", pesapalLink:"", usdRate:2600, delivery:[{ area:"Zanzibar (Unguja)", fee:3000 }] }; }
function saveLocal(){ if (S.mode !== "github") save(KEY + "-data", { products:D.products, config:D.config, orders:D.orders }); }

async function publishProducts(){
  if (S.mode !== "github"){ download("products.json", JSON.stringify(D.products, null, 2)); dirty.products = false; saveLocal(); render(); toast("products.json downloaded. Upload it to your store repository to publish."); return; }
  try { D.sha.products = await ghPut(S.repo, "products.json", enc(JSON.stringify(D.products, null, 2)), D.sha.products, "Update products from Johari Operations"); dirty.products = false; render(); toast("Published. Your store updates in about a minute."); }
  catch(e){ toast(e.message, true); }
}
async function publishConfig(){
  if (S.mode !== "github"){ download("config.json", JSON.stringify(D.config, null, 2)); dirty.config = false; saveLocal(); render(); toast("config.json downloaded. Upload it to your store repository to publish."); return; }
  try { D.sha.config = await ghPut(S.repo, "config.json", enc(JSON.stringify(D.config, null, 2)), D.sha.config, "Update store settings from Johari Operations"); dirty.config = false; render(); toast("Settings published. Live in about a minute."); }
  catch(e){ toast(e.message, true); }
}
async function saveOrders(msg){
  if (S.mode !== "github"){ saveLocal(); return true; }
  try { D.sha.orders = await ghPut(S.dataRepo, "orders.json", enc(JSON.stringify(D.orders, null, 2)), D.sha.orders, msg || "Update orders"); return true; }
  catch(e){ toast(e.message, true); return false; }
}
function download(name, text, type){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type:type || "application/json" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

/* ---------- setup ---------- */
function setup(){
  $("tabs").hidden = true; syncNote();
  const s = S || {};
  $("main").innerHTML = `
  <div class="setup">
    <span class="eyebrow">Welcome</span><h2>Connect your store</h2>
    <p class="muted">Enter your GitHub details once. Your access key is saved only in this browser, so use your own phone or computer, and press “Sign out” on shared devices.</p>
    <div class="panel form">
      <label>GitHub username<input id="sUser" value="${esc(s.user || "")}" autocomplete="username" placeholder="for example johari-tz"></label>
      <div class="grid2">
        <label>Store repository (public)<input id="sRepo" value="${esc(s.repo || "johari-market")}"></label>
        <label>Orders repository (private)<input id="sData" value="${esc(s.dataRepo || "johari-orders")}"></label>
      </div>
      <label>Access key (fine-grained personal access token)<input id="sToken" type="password" value="${esc(s.token || "")}" autocomplete="off" placeholder="github_pat_…"><span class="hint">Needs “Contents: Read and write” on both repositories. See the README for the 2-minute steps.</span></label>
      <label>Branch<input id="sBranch" value="${esc(s.branch || "main")}"></label>
      <div class="row"><button class="btn gold" id="sGo">Connect</button><button class="btn" id="sLocal">Use without GitHub (this device only)</button></div>
    </div>
  </div>`;
  $("sGo").onclick = async () => {
    const n = { mode:"github", user:$("sUser").value.trim(), repo:$("sRepo").value.trim(), dataRepo:$("sData").value.trim(), token:$("sToken").value.trim(), branch:$("sBranch").value.trim() || "main" };
    if (!n.user || !n.repo || !n.dataRepo || !n.token) return toast("Please fill in all the fields.", true);
    S = n; save(KEY, S); loadAll();
  };
  $("sLocal").onclick = () => { S = { mode:"local" }; save(KEY, S); loadAll(); };
}

/* ---------- tabs ---------- */
$("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
addEventListener("beforeunload", e => { if (dirty.products || dirty.config){ e.preventDefault(); e.returnValue = ""; } });
function render(){
  $("tabs").querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  ({ dash:renderDash, orders:renderOrders, products:renderProducts, customers:renderCustomers, settings:renderSettings })[tab]();
}

/* ---------- dashboard ---------- */
function renderDash(){
  const now = new Date(), ym = now.toISOString().slice(0,7);
  const month = D.orders.filter(o => (o.date || "").slice(0,7) === ym);
  const paidMonth = month.filter(o => PAID.includes(o.status));
  const awaiting = D.orders.filter(o => ["New","Confirmed"].includes(o.status));
  const toDeliver = D.orders.filter(o => ["Paid","Sourcing","Out for delivery"].includes(o.status));
  const live = D.products.filter(p => p.status !== "hidden"), sold = D.products.filter(p => p.status === "sold_out");
  const top = {}; D.orders.filter(o => PAID.includes(o.status)).forEach(o => (o.items || []).forEach(i => top[i.name] = (top[i.name] || 0) + (+i.qty || 0)));
  const topList = Object.entries(top).sort((a,b) => b[1] - a[1]).slice(0,5);
  const recent = [...D.orders].sort((a,b) => (b.date || "").localeCompare(a.date || "")).slice(0,6);
  $("main").innerHTML = `
    <div class="toolbar"><div><span class="eyebrow">${now.toLocaleDateString("en-GB",{ month:"long", year:"numeric" })}</span><h2>Dashboard</h2></div><button class="btn gold" id="dNew">New order</button></div>
    <div class="cards">
      <div class="stat"><span class="eyebrow">Sales this month</span><b>${tzs(paidMonth.reduce((s,o) => s + num(o.total), 0))}</b><span class="muted small">${paidMonth.length} paid order${paidMonth.length === 1 ? "" : "s"}</span></div>
      <div class="stat"><span class="eyebrow">Orders this month</span><b>${month.length}</b><span class="muted small">all statuses</span></div>
      <div class="stat"><span class="eyebrow">Awaiting payment</span><b>${awaiting.length}</b><span class="muted small">${tzs(awaiting.reduce((s,o) => s + num(o.total), 0))} to collect</span></div>
      <div class="stat"><span class="eyebrow">To source and deliver</span><b>${toDeliver.length}</b><span class="muted small">paid, not yet delivered</span></div>
      <div class="stat"><span class="eyebrow">Products</span><b>${live.length}</b><span class="muted small">live, ${sold.length} sold out</span></div>
    </div>
    <div class="two">
      <div class="panel"><h3>Recent orders</h3>${recent.length ? `<table class="mobile-cards"><tbody>${recent.map(o => `<tr><td><b>${esc(o.id)}</b> · ${esc(o.name || "—")}<br><span class="muted small">${fmtDate(o.date)}</span></td><td class="num">${tzs(o.total)}<br>${statusPill(o.status)}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">No orders yet. When a WhatsApp order arrives, press “New order” and paste it in.</p>`}</div>
      <div class="panel"><h3>Best sellers</h3>${topList.length ? `<table><tbody>${topList.map(([n,q]) => `<tr><td>${esc(n)}</td><td class="num">${q} sold</td></tr>`).join("")}</tbody></table>` : `<p class="empty">Best sellers appear here once orders are paid.</p>`}</div>
    </div>`;
  $("dNew").onclick = () => editOrder(null);
}
const fmtDate = d => d ? new Date(d).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" }) : "";
function statusPill(s){ const cls = s === "Delivered" || s === "Paid" ? "ok" : s === "Cancelled" ? "bad" : s === "New" ? "warn" : ""; return `<span class="pill ${cls}">${esc(s)}</span>`; }

/* ---------- orders ---------- */
function renderOrders(){
  const q = orderSearch.toLowerCase();
  const list = [...D.orders].sort((a,b) => (b.date || "").localeCompare(a.date || "")).filter(o => (orderFilter === "All" || o.status === orderFilter) && (!q || [o.id, o.name, o.phone, o.area].join(" ").toLowerCase().includes(q)));
  $("main").innerHTML = `

/* parse the order message the store sends on WhatsApp */
function parseOrder(text){
  const o = { items:[] }, lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const grab = (re) => { const l = lines.find(x => re.test(x)); return l ? l.replace(re, "").trim() : ""; };
  lines.forEach(l => {
    const m = l.match(/^[•\-*]\s*(.+?)\s+x(\d+)\s*=\s*TSh\s*([\d,]+)/i);
    if (m){ let full = m[1], name = full, opt = ""; if (full.endsWith(")")){ const k = full.lastIndexOf(" ("); if (k > 0){ name = full.slice(0,k); opt = full.slice(k+2, -1); } } o.items.push({ name, opt, qty:+m[2], total:num(m[3]) }); }
  });
  o.subtotal = num(grab(/^Subtotal:\s*/i));
  const del = lines.find(l => /^Delivery\s*\(/i.test(l)) || "";
  const dm = del.match(/^Delivery\s*\((.*?)\):\s*(.*)$/i);
  if (dm){ o.area = dm[1] === "-" ? "" : dm[1]; o.delivery = /quote/i.test(dm[2]) ? 0 : num(dm[2]); }
  o.total = num(grab(/^Total:\s*/i)) || (o.subtotal + (o.delivery || 0));
  o.name = grab(/^Name:\s*/i); o.phone = grab(/^Phone:\s*/i);
  const a = grab(/^Address:\s*/i), n = grab(/^Note:\s*/i);
  o.address = a === "-" ? "" : a; o.note = n === "-" ? "" : n;
  return o;
}

function exportCsv(){

}

function resize(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q)); };
    img.onerror = rej; img.src = url;
  });
}

    <div class="two">
      <div class="panel form"><h3>Store details</h3>
        <label>Store name<input id="cName" value="${esc(c.name)}"></label>
        <label>WhatsApp number for orders<input id="cWa" value="${esc(c.whatsapp)}" inputmode="numeric"><span class="hint">Country code and number, no + or spaces. For example 255712345678.</span></label>
        <label>Lipa Namba / mobile money number<input id="cLipa" value="${esc(c.lipaNamba)}"></label>
        <label>Pesapal payment link (optional)<input id="cPes" value="${esc(c.pesapalLink)}" placeholder="https://…"><span class="hint">Adding it switches on the “Pay by card” button.</span></label>
        <label>Exchange rate (TSh per 1 US$)<input id="cRate" inputmode="numeric" value="${esc(c.usdRate)}"></label>
      </div>
      <div class="panel form"><h3>Delivery areas and fees</h3>
        <table class="items"><thead><tr><th>Area</th><th>Fee (TSh)</th><th></th></tr></thead><tbody id="cDel">${(c.delivery || []).map((d,k) => `<tr><td><input data-d="${k}" data-k="area" value="${esc(d.area)}" aria-label="Area"></td><td><input data-d="${k}" data-k="fee" value="${d.fee === null ? "" : esc(d.fee)}" placeholder="quote" aria-label="Fee"></td><td><button class="btn danger" data-dr="${k}" aria-label="Remove area">×</button></td></tr>`).join("")}</tbody></table>
        <p class="hint small muted">Leave the fee empty to quote it on WhatsApp.</p>
        <div><button class="btn" id="cAddDel">Add area</button></div>
      </div>
    </div>
    <div class="panel"><h3>Connection</h3><p class="muted small">${S.mode === "github" ? `Store: <b>${esc(S.user)}/${esc(S.repo)}</b> · Orders (private): <b>${esc(S.user)}/${esc(S.dataRepo)}</b> · Branch: ${esc(S.branch || "main")}` : "Working on this device only. Data is saved in this browser; use Export CSV to back up orders."}</p>
      <div class="row"><button class="btn" id="cSwitch">Change connection</button><button class="btn danger" id="cOut">Sign out of this device</button></div></div>`;
  const mark = () => { dirty.config = true; $("cPub").disabled = false; saveLocal(); };
  [["cName","name"],["cWa","whatsapp"],["cLipa","lipaNamba"],["cPes","pesapalLink"],["cRate","usdRate"]].forEach(([id,k]) => $(id).oninput = e => { c[k] = k === "usdRate" ? num(e.target.value) : k === "whatsapp" ? e.target.value.replace(/\D/g, "") : e.target.value.trim(); mark(); });
  const bindDel = () => {
    $("cDel").querySelectorAll("input").forEach(inp => inp.oninput = () => { const d = c.delivery[+inp.dataset.d]; if (inp.dataset.k === "fee") d.fee = inp.value.trim() === "" ? null : num(inp.value); else d.area = inp.value; mark(); });
    $("cDel").querySelectorAll("[data-dr]").forEach(b => b.onclick = () => { c.delivery.splice(+b.dataset.dr, 1); mark(); renderSettings(); });
  };
  bindDel();
  $("cAddDel").onclick = () => { (c.delivery = c.delivery || []).push({ area:"", fee:0 }); mark(); renderSettings(); };
  $("cPub").onclick = publishConfig;
  $("cSwitch").onclick = () => setup();
  $("cOut").onclick = () => { if (!confirm("Sign out? Your access key will be removed from this device.")) return; localStorage.removeItem(KEY); S = null; location.reload(); };
}

$("dlgX").onclick = () => $("dlg").close();
if (S) loadAll(); else setup();
</script>
</body>
</html>
